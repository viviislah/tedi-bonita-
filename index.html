<!DOCTYPE html>
<html lang="id">
<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#0b1329',
                        navyLight: '#162347',
                        cream: '#fdfbf7',
                        beige: '#f6f1e8',
                        gold: '#d4af37',
                        goldLight: '#f4e4b5',
                        goldDark: '#aa8212'

    <style>
        html {
            scroll-behavior: smooth;
        }
        body {
            background-color: #0b1329;
            font-family: 'Poppins', sans-serif;
            color: #0b1329;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background-color: #fdfbf7;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            overflow-x: hidden;
        }

        .glass-dark {
            background: rgba(11, 19, 41, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
        }

        .glass-light {
            background: rgba(253, 251, 247, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .fade-in-section {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        
        .fade-in-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .spin-slow {
            animation: spinSlow 9s linear infinite;
        }

        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f6f1e8;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }

        .cover-wrapper {
            transition: transform 1.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 1.5s cubic-bezier(0.22, 1, 0.36, 1), filter 1.5s ease-in-out;
            will-change: transform, opacity, filter;
        }
        .cover-wrapper.opening {
            transform: scale(1.1) translateY(-3%);
            opacity: 0;
            filter: blur(15px);
            pointer-events: none;
        }

        @keyframes heroReveal {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(30px);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0px);
            }
        }
        .animate-hero-reveal {
            animation: heroReveal 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes pulseGold {
            0%, 100% {
                box-shadow: 0 4px 20px rgba(212, 175, 55, 0.45);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 6px 32px rgba(212, 175, 55, 0.75), 0 0 14px rgba(255, 255, 255, 0.5);
                transform: scale(1.02);
            }
        }
        .pulse-gold {
            animation: pulseGold 2.4s infinite ease-in-out;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-70px) rotate(180deg); opacity: 0; }
        }
        .sparkle-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #f4e4b5;
            border-radius: 50%;
            box-shadow: 0 0 8px #d4af37;
            animation: floatParticle 4s infinite ease-in-out;
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseApp = null;
        window.firebaseDb = null;
        window.firebaseAuth = null;
        window.signInAnonymously = signInAnonymously;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.serverTimestamp = serverTimestamp;

        try {
            let config = null;
            if (typeof __firebase_config !== 'undefined' && __firebase_config) {
                config = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
            }
            if (config && config.apiKey && config.projectId && config.projectId.trim() !== '') {
                setLogLevel('silent');
                window.firebaseApp = initializeApp(config);
                window.firebaseDb = getFirestore(window.firebaseApp);
                window.firebaseAuth = getAuth(window.firebaseApp);
            }
        } catch (e) {
            console.warn("Menggunakan mode penyimpanan lokal.");
        }
    </script>

        const BACKGROUND_DRIVE_ID = "196ET76KUeteVuU8VEgdOFuVtvypby6yr";
        const GALLERY_PHOTOS = [
            { id: "12TWmOloQ_b0E6ed2LaM1nCHsKMUX8YXQ", caption: "Momen Bahagia 1" },
            { id: "16qgHejZ-2QQNSPEfdhjf-cqwlVtbKVNs", caption: "Momen Bahagia 2" },
            { id: "196ET76KUeteVuU8VEgdOFuVtvypby6yr", caption: "Momen Bahagia 3" },

            { id: "1irhx74p8PE_mUI28ozV8i_Msw3LGW_jD", caption: "Momen Bahagia 5" }

        // Toast notification tanpa fungsi alert()
        const showToast = (text) => {
            const existing = document.getElementById('app-toast');
            if (existing) existing.remove();
            
            const toast = document.createElement('div');
            toast.id = 'app-toast';
            toast.textContent = text;
            toast.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 z-[9999] bg-navy text-goldLight px-5 py-2.5 rounded-full text-xs font-sans shadow-2xl border border-gold/40 tracking-wide transition-all duration-300';
            document.body.appendChild(toast);
            
            // Trigger reflow to ensure transition works
            void toast.offsetWidth;
            
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        };

        const Cover = ({ onOpen, guestName, isOpening }) => {
            return (
                <div className="relative w-full h-screen bg-navy text-cream flex flex-col justify-between items-center text-center px-6 py-12 overflow-hidden select-none">
                    {/* Partikel Kilau Emas Mengambang */}
                    <div className="absolute inset-0 pointer-events-none z-[5]">
                        <div className="sparkle-dot top-1/4 left-1/5" style={{ animationDelay: '0.2s' }}></div>
                        <div className="sparkle-dot top-1/3 right-1/4" style={{ animationDelay: '1.5s' }}></div>

                        <div className="sparkle-dot top-2/3 right-1/5" style={{ animationDelay: '0.9s' }}></div>
                    </div>

                    {/* Background Foto dengan Transparansi Lembut */}

                            className={`w-full h-full object-cover object-center opacity-40 transition-transform duration-1000 ${isOpening ? 'scale-110 brightness-110' : 'scale-105'}`}
                            onError={(e) => {
                                if (!e.target.dataset.triedFallback) {

                        </p>

                    {/* Kartu Penerima Undangan */}

        const Hero = () => {

                            Minggu, 27 September 2026
                        </p>
                    </div>

                    <div className="absolute bottom-6 z-10 animate-bounce text-gold/70">
                        <i className="fas fa-chevron-down text-xl"></i>
                    </div>
                </div>
            );
        };

        const Greeting = () => {
            return (
                <div className="py-20 px-6 text-center bg-cream relative">
                    <div className="fade-in-section max-w-sm mx-auto">
                        <div className="mb-6">
                            <p className="font-serif text-xl text-gold font-medium mb-3">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
                            <p className="font-sans text-xs text-navy/70 leading-relaxed italic">
                                "Dan di antara tanda-tanda (kebesaran)-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri, agar kamu cenderung dan merasa tenteram kepadanya."
                                <br/><span className="text-[10px] font-semibold text-navy/60 mt-1 block">(QS. Ar-Rum: 21)</span>
                            </p>
                        </div>

                        <div className="w-12 h-px bg-gold/40 mx-auto my-8"></div>

                        <h2 className="font-sans text-sm text-navy font-semibold uppercase tracking-wider mb-2">
                            Assalamu'alaikum Wr. Wb.
                        </h2>
                        <p className="font-sans text-xs text-navy/70 leading-relaxed mb-10">
                            Dengan memohon rahmat dan ridho Allah SWT, kami bermaksud mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:

                            </div>

                            <div className="font-serif text-3xl text-gold">&</div>

                            <div className="glass-light p-6 rounded-2xl shadow-sm border border-gold/20">
                                <h3 className="font-serif text-3xl text-navy mb-1">Bonita Sari</h3>
                                <p className="font-serif italic text-gold text-sm mb-3">Mempelai Wanita</p>
                                <p className="font-sans text-xs text-navy/70 leading-relaxed">

                </div>
            );
        };

        const EventDetails = () => {
            const MAP_URL = "https://www.google.com/maps/place/6%C2%B017'04.3%22S+106%C2%B009'38.4%22E/@-6.2845255,106.1580873,17z/data=!3m1!4b1!4m4!3m3!8m2!3d-6.2845255!4d106.1606622?hl=id";
            const EMBED_MAP_URL = "https://maps.google.com/maps?q=-6.2845255,106.1606622&hl=id&z=16&output=embed";

            const handleOpenMaps = () => {
                window.open(MAP_URL, "_blank");
            };

            return (
                <div className="py-20 px-6 bg-beige relative">
                    <div className="text-center mb-10 fade-in-section">
                        <span className="text-gold tracking-[0.25em] text-[11px] uppercase font-semibold block mb-2">
                            Waktu & Tempat
                        </span>
                        <h2 className="font-serif text-3xl text-navy">Detail Acara</h2>
                    </div>

                    <div className="bg-white rounded-3xl p-8 shadow-xl border border-gold/25 relative overflow-hidden fade-in-section max-w-sm mx-auto">
                        <div className="text-center mb-8">
                            <div className="w-14 h-14 bg-beige text-gold rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-gold/20">
                                <i className="far fa-calendar-check"></i>
                            </div>
                            <h3 className="font-serif text-2xl text-navy font-semibold mb-2">Akad & Resepsi</h3>

                        </div>

                        <div className="border-t border-dashed border-gold/30 my-6"></div>

                        <div className="text-center">

                                <i className="fas fa-map-marker-alt"></i>
                            </div>
                            <h4 className="font-serif text-lg text-navy font-semibold mb-2">Lokasi Acara</h4>
                            <p className="font-sans text-xs text-navy/75 leading-relaxed mb-4 font-normal">

                            </p>

            );
        };

        const Countdown = () => {
            const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });

            useEffect(() => {
                const calculateDistance = () => {
                    const now = new Date().getTime();
                    const difference = WEDDING_DATE - now;

                    if (difference <= 0) {
                        setTimeLeft({ days: 0, hours: 0, minutes: 0, seconds: 0 });
                        return;
                    }

                    setTimeLeft({
                        days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                        hours: Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                        minutes: Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60)),
                        seconds: Math.floor((difference % (1000 * 60)) / 1000)
                    });
                };

                calculateDistance();
                const interval = setInterval(calculateDistance, 1000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="py-16 px-6 bg-navy text-cream text-center relative overflow-hidden">
                    <div className="relative z-10 fade-in-section max-w-sm mx-auto">

                            ))}

                    </div>
                </div>
            );
        };

        const Gallery = () => {
            const [selectedPhoto, setSelectedPhoto] = useState(null);

            return (
                <div className="py-20 px-4 bg-cream relative">
                    <div className="text-center mb-10 fade-in-section">

                    </div>

                    <div className="grid grid-cols-2 gap-3 max-w-sm mx-auto fade-in-section">
                        {GALLERY_PHOTOS.map((photo, index) => {
                            const isFirst = index === 0;
                            return (
                                <div 
                                    key={photo.id}
                                    onClick={() => setSelectedPhoto(getDriveUrl(photo.id))}

                                    <img 
                                        src={getDriveUrl(photo.id)} 
                                        alt={photo.caption} 
                                        loading="lazy"
                                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                                        onError={(e) => {
                                            if (!e.target.dataset.triedFallback) {
                                                e.target.dataset.triedFallback = "true";
                                                e.target.src = getDriveFallbackUrl(photo.id);
                                            }
                                        }}
                                    />
                                    <div className="absolute inset-0 bg-navy/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                                        <div className="w-10 h-10 rounded-full bg-white/80 text-navy flex items-center justify-center text-sm shadow">
                                            <i className="fas fa-search-plus text-gold"></i>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Lightbox Modal */}

                }
            ];

            const [audioIndex, setAudioIndex] = useState(0);
            const [activeSongUrl, setActiveSongUrl] = useState(() => {
                return localStorage.getItem('bonita_tedi_custom_music_url') || DEFAULT_PLAYLIST[0].url;
            });

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.get('admin') === 'true') {
                    setShowAdminAuthModal(true);
                }
                const nameParam = params.get('nama');
                if (nameParam) {
                    setGuestName(decodeURIComponent(nameParam));
                }
            }, []);

            // Handler verifikasi kata sandi admin
            const handleAdminLogin = (e) => {
                if (e) e.preventDefault();
                const sanitizedInput = adminPasswordInput.trim().toLowerCase();
                
                if (sanitizedInput === 'bonita') {
                    setIsAdmin(true);
                    setShowAdminAuthModal(false);
                    setAdminPasswordInput('');
                    setAdminPasswordError('');
                    showToast("Login Admin berhasil!");
                } else {
                    setAdminPasswordError("Kata sandi salah! Silakan coba lagi.");
                    showToast("Kata sandi salah!");
                }
            };

            useEffect(() => {
                if (!hasOpened && !isOpening) return;
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                        }
                    });
                }, { threshold: 0.1 });

                const elements = document.querySelectorAll('.fade-in-section');
                elements.forEach(el => observer.observe(el));

                return () => observer.disconnect();
            }, [hasOpened, isOpening]);

            const handleOpenInvitation = () => {
                setIsOpening(true);

                if (audioRef.current) {
                    audioRef.current.play().then(() => {
                        setIsPlaying(true);
                    }).catch(() => {
                        setIsPlaying(false);
                    });
                }

                setTimeout(() => {
                    setHasOpened(true);
                    window.scrollTo({ top: 0, behavior: 'instant' });
                }, 1300);
            };

            const toggleMusic = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                    showToast("Musik dijeda");
                } else {
                    audioRef.current.play().then(() => {
                        setIsPlaying(true);
                        showToast("Memutar alunan musik pernikahan");
                    }).catch(() => {});
                }
            };

            const handleNextTrack = () => {
                const nextIdx = (audioIndex + 1) % DEFAULT_PLAYLIST.length;
                setAudioIndex(nextIdx);
                const nextTrack = DEFAULT_PLAYLIST[nextIdx];
                setActiveSongUrl(nextTrack.url);
                if (audioRef.current) {
                    audioRef.current.src = nextTrack.url;
                    audioRef.current.play().then(() => {
                        setIsPlaying(true);
                        showToast(`Memutar: ${nextTrack.title}`);
                    }).catch(() => {});
                }
            };

            const handleAudioError = () => {
                if (audioIndex < DEFAULT_PLAYLIST.length - 1) {
                    const nextIdx = audioIndex + 1;
                    setAudioIndex(nextIdx);
                    const nextTrack = DEFAULT_PLAYLIST[nextIdx];
                    setActiveSongUrl(nextTrack.url);
                    if (audioRef.current) {
                        audioRef.current.src = nextTrack.url;
                        if (isPlaying) {
                            audioRef.current.play().catch(() => {});
                        }
                    }
                }
            };

            // Jika mode admin aktif, tampilkan langsung Dashboard Admin
            if (isAdmin) {
                return <AdminDashboard onBack={() => setIsAdmin(false)} />;
            }

            const currentTrackInfo = DEFAULT_PLAYLIST[audioIndex] || { title: "Musik Pernikahan" };

            return (
                <div className="app-container relative overflow-hidden">
                    {/* Elemen Audio Latar Belakang Musik Pernikahan */}
                    <audio 
                        ref={audioRef}
                        src={activeSongUrl}
                        preload="auto"
                        loop
                        onError={handleAudioError}
                    />

                    {/* Halaman Utama Undangan */}
                    {(isOpening || hasOpened) && (
                        <div className="relative bg-cream animate-hero-reveal">
                            <Hero />
                            <Greeting />
                            <EventDetails />
                            <Countdown />
                            <Gallery />
                            <RSVP />
                            <Wishes />
                            <WeddingGift />
                            <Footer onOpenAdmin={() => {
                                setShowAdminAuthModal(true);
                                setAdminPasswordInput('');
                                setAdminPasswordError('');
                            }} />
                            <FloatingAudio 
                                isPlaying={isPlaying} 
                                onToggle={toggleMusic} 
                                currentTrack={currentTrackInfo}
                                onNextTrack={handleNextTrack}
                            />
                        </div>
                    )}

                    {/* Halaman Sampul Depan */}
                    {!hasOpened && (
                        <div className={`fixed inset-0 z-50 max-w-[480px] mx-auto cover-wrapper ${isOpening ? 'opening' : ''}`}>
                            <Cover 
                                onOpen={handleOpenInvitation} 
                                guestName={guestName}
                                isOpening={isOpening}
                            />
                        </div>
                    )}

                    {}
                    {/* Modal Proteksi Kata Sandi Admin */}
                    {showAdminAuthModal && (
                        <div className="fixed inset-0 z-[200] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-gold/40 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-slate-100 relative animate-hero-reveal">
                                <button 
                                    onClick={() => {
                                        setShowAdminAuthModal(false);
                                        setAdminPasswordInput('');
                                        setAdminPasswordError('');
                                    }}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-xs transition-colors"
                                    title="Tutup"
                                >
                                    <i className="fas fa-times"></i>
                                </button>
                                
                                <div className="text-center mb-5">
                                    <div className="w-12 h-12 bg-gold/15 text-gold rounded-full flex items-center justify-center mx-auto mb-3 text-xl border border-gold/30">
                                        <i className="fas fa-lock"></i>
                                    </div>
                                    <h3 className="font-serif text-xl font-bold text-gold">Akses Dashboard Admin</h3>
                                    <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                                        Halaman ini dilindungi. Masukkan kata sandi admin untuk melanjutkan.
                                    </p>
                                </div>

                                <form onSubmit={handleAdminLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-300 mb-1.5 ml-1">
                                            Kata Sandi Admin
                                        </label>
                                        <div className="relative">
                                            <input 
                                                type={showPasswordText ? "text" : "password"}
                                                required
                                                autoFocus
                                                placeholder="Masukkan kata sandi..."
                                                value={adminPasswordInput}
                                                onChange={(e) => {
                                                    setAdminPasswordInput(e.target.value);
                                                    if (adminPasswordError) setAdminPasswordError('');
                                                }}
                                                className="w-full bg-slate-800/90 border border-slate-700 rounded-xl pl-4 pr-10 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-gold transition-colors"
                                            />
                                            <button 
                                                type="button"
                                                onClick={() => setShowPasswordText(!showPasswordText)}
                                                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-gold text-xs transition-colors"
                                                title={showPasswordText ? "Sembunyikan Sandi" : "Tampilkan Sandi"}
                                            >
                                                <i className={`fas ${showPasswordText ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                            </button>
                                        </div>
                                        {adminPasswordError && (
                                            <p className="text-[11px] text-rose-400 mt-1.5 ml-1 flex items-center gap-1">
                                                <i className="fas fa-exclamation-circle text-[10px]"></i> {adminPasswordError}
                                            </p>
                                        )}
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button 
                                            type="button"
                                            onClick={() => {
                                                setShowAdminAuthModal(false);
                                                setAdminPasswordInput('');
                                                setAdminPasswordError('');
                                            }}
                                            className="w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 px-4 rounded-xl text-xs transition-colors"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            type="submit"
                                            className="w-1/2 bg-gradient-to-r from-gold to-goldDark hover:brightness-110 active:scale-95 text-navy font-semibold py-2.5 px-4 rounded-xl text-xs transition-all shadow-lg flex items-center justify-center gap-1.5"
                                        >
                                            <i className="fas fa-key text-[10px]"></i> Masuk
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
